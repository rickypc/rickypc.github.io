telemetry = false

[run]
silent = true

[test]
coverage = true
coveragePathIgnorePatterns = ["**/bun-test-assets/**", "**/tests/**"]
coverageReporter = ["lcov", "text"]
coverageSkipTestFiles = true
coverageThreshold = { functions = 1.0, lines = 1.0, statements = 1.0 }
preload = ["./tests/unit/preload.ts"]
